:root{
  --brand-mud:#803003; --brand-bg:#EDE5DA; --brand-white:#FBFAF8; --brand-black:#161A24;
  --mud-50:#FBF3EC; --mud-100:#F3E0CF; --mud-200:#E4BFA0; --mud-400:#B5703F;
  --mud-500:#803003; --mud-600:#6B2802; --mud-700:#561F02;
  --oat-50:#FBFAF8; --oat-100:#F5F0E9; --oat-150:#EDE5DA; --oat-200:#E2D7C6;
  --oat-300:#CFC0A9; --oat-400:#B09D82; --oat-500:#8C7A60; --oat-600:#6A5B44;
  --oat-700:#4A3E2C; --oat-900:#161A24;
  --fg-1:var(--brand-black); --fg-2:var(--oat-700); --fg-3:var(--oat-500);
  --fg-on-mud:var(--brand-white); --fg-brand:var(--brand-mud);
  --bg-page:var(--brand-bg); --bg-surface:var(--brand-white); --bg-sunken:var(--oat-100);
  --border-hair:rgba(22,26,36,.08); --border-soft:rgba(22,26,36,.14);
  --border-strong:rgba(22,26,36,.28); --border-mud:rgba(128,48,3,.24); --rule:var(--oat-200);
  --ok:#5A7A3C;
  --font-display:'Recoleta','Inter Tight',Inter,Garamond,serif;
  --font-body:'Inter Tight',Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(74,62,44,.06);
  --shadow-sm:0 2px 6px rgba(74,62,44,.08),0 1px 2px rgba(74,62,44,.04);
  --shadow-md:0 8px 20px rgba(74,62,44,.10),0 2px 6px rgba(74,62,44,.06);
  --shadow-focus:0 0 0 3px rgba(128,48,3,.28);
  --ease:cubic-bezier(.4,0,.2,1); --dur:200ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg-page);color:var(--fg-1);font-family:var(--font-body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
@media(min-width:900px){.wrap{padding:0 64px}}

/* nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;gap:16px}
.brand img{height:46px;display:block}
.nav-right{display:flex;align-items:center;gap:12px}
.lang{font-size:14px;font-weight:500;color:var(--fg-2);text-decoration:none;
  border:1px solid var(--border-soft);padding:7px 14px;border-radius:var(--radius-pill);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.lang:hover{background:rgba(22,26,36,.04);color:var(--fg-1)}
.nav-cta{font-size:14px;font-weight:600;color:var(--fg-on-mud);background:var(--brand-mud);
  padding:9px 18px;border-radius:var(--radius-pill);text-decoration:none;white-space:nowrap;
  transition:background var(--dur) var(--ease)}
.nav-cta:hover{background:var(--mud-600)}
.nav-cta:active{background:var(--mud-700)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center;padding:48px 0 96px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-brand);margin-bottom:20px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(38px,6vw,60px);
  line-height:1.05;letter-spacing:-.02em;margin-bottom:24px}
h1 span{display:block;color:var(--fg-brand)}
.sub{font-size:17px;color:var(--fg-2);max-width:46ch;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-body);
  font-size:16px;font-weight:600;cursor:pointer;padding:14px 28px;border:0;text-decoration:none;
  border-radius:var(--radius-pill);background:var(--brand-mud);color:var(--fg-on-mud);
  transition:background var(--dur) var(--ease)}
.btn:hover{background:var(--mud-600)} .btn:active{background:var(--mud-700)}
.btn:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.btn.ghost{background:transparent;color:var(--fg-1);border:1px solid var(--border-soft)}
.btn.ghost:hover{background:rgba(22,26,36,.04)}
.btn.ghost:active{background:rgba(22,26,36,.08)}
.hero-meta{display:flex;gap:28px;margin-top:28px;font-size:14px;color:var(--fg-3);flex-wrap:wrap}
.hero-meta div{display:flex;align-items:center;gap:8px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--mud-400);flex:none}

/* kundali */
.kundali-stage{display:flex;align-items:center;justify-content:center}
.kundali{width:100%;max-width:380px;height:auto}
.k-frame{stroke:var(--oat-500);stroke-width:1.5;fill:none}
.k-line{stroke:var(--oat-400);stroke-width:1;fill:none}
.k-house{fill:transparent;transition:fill var(--dur) var(--ease)}
.k-house.lit{fill:rgba(128,48,3,.10)}
.k-house.locked{fill:rgba(128,48,3,.20);stroke:var(--brand-mud);stroke-width:1.25}
.k-num{font-family:var(--font-body);font-size:11px;fill:var(--oat-500)}
.k-core{font-family:var(--font-display);font-weight:700;fill:var(--fg-brand);text-anchor:middle}

/* strip */
.strip{background:var(--bg-sunken);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;padding:56px 0}
.pcell .big{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--fg-brand);
  line-height:1.15;margin-bottom:10px}
.pcell p{font-size:15px;color:var(--fg-2)}

section{padding:96px 0}
.sec-head{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4vw,38px);
  line-height:1.15;letter-spacing:-.015em;margin-bottom:12px}
.sec-sub{color:var(--fg-2);font-size:16px;max-width:60ch;margin-bottom:40px}

/* quiz */
.quiz-shell{background:var(--bg-surface);border:1px solid var(--border-hair);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:40px;
  display:grid;grid-template-columns:230px 1fr;gap:48px;align-items:start}
.quiz-side{position:sticky;top:32px}
.mini-k{width:100%;max-width:190px;display:block}
.mini-cap{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--fg-brand);
  margin-top:12px;min-height:20px}
.prog-wrap{margin-top:20px}
.prog-label{font-size:13px;color:var(--fg-3);margin-bottom:8px}
.prog-bar{height:3px;background:var(--oat-200);border-radius:var(--radius-pill);overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--brand-mud);transition:width 360ms var(--ease)}
.step-n{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-brand);margin-bottom:12px}
.q-text{font-family:var(--font-display);font-weight:700;font-size:clamp(23px,3vw,30px);
  line-height:1.2;letter-spacing:-.01em;margin-bottom:10px}
.q-picked{font-size:15px;color:var(--fg-brand);font-weight:600;margin-bottom:4px}
.q-help{font-size:15px;color:var(--fg-2);margin-bottom:24px;max-width:56ch}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  padding:14px 18px;color:var(--fg-1);font-family:var(--font-body);font-size:16px;line-height:1.4;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.opt:hover{background:rgba(22,26,36,.04);border-color:var(--border-strong)}
.opt:active{background:rgba(22,26,36,.08)}
.opt:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.opt.sel{border-color:var(--brand-mud);background:var(--mud-50)}
.opt .mark{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--oat-400);
  flex:none;margin-top:3px;transition:border-color var(--dur) var(--ease)}
.opt:hover .mark{border-color:var(--oat-600)}
.opt.sel .mark{border-color:var(--brand-mud);border-width:5px}
.opt .lab{flex:1}
.opt .lab small{display:block;font-size:14px;color:var(--fg-3);margin-top:2px}
.nudge{font-size:14px;color:var(--fg-3);margin-top:16px;font-style:normal}
.q-nav{display:flex;gap:12px;margin-top:28px;align-items:center}
.back{background:none;border:0;color:var(--fg-3);cursor:pointer;font-family:var(--font-body);
  font-size:15px;padding:8px 2px;transition:color var(--dur) var(--ease)}
.back:hover{color:var(--fg-1)}
.back:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--radius-xs)}

/* fields */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--fg-3);margin-bottom:6px}
.field select{width:100%;background:var(--bg-surface);border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);padding:13px 14px;color:var(--fg-1);
  font-family:var(--font-body);font-size:16px}
.field select:focus{outline:none;border-color:var(--brand-mud);box-shadow:var(--shadow-focus)}

/* searchable city picker */
.city-field{position:relative;margin-bottom:8px}
.field input[type=text]{width:100%;background:var(--bg-surface);
  border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  padding:13px 14px;color:var(--fg-1);font-family:var(--font-body);font-size:16px}
.field input[type=text]:focus{outline:none;border-color:var(--brand-mud);box-shadow:var(--shadow-focus)}
.field input[type=text]:disabled{background:var(--bg-sunken);color:var(--fg-3);cursor:not-allowed}
.city-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;
  max-height:264px;overflow-y:auto;background:var(--bg-surface);
  border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);-webkit-overflow-scrolling:touch}
.city-opt{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:11px 14px;font-family:var(--font-body);font-size:15.5px;color:var(--fg-1)}
.city-opt:hover{background:var(--mud-50)}
.city-opt+.city-opt{border-top:1px solid var(--border-hair)}
.err{color:#A83224;font-size:14px;min-height:20px;margin-bottom:4px}

/* result */
.res-time{font-family:var(--font-body);font-weight:700;
  font-size:clamp(46px,8vw,72px);color:var(--fg-brand);line-height:1;
  letter-spacing:-.02em;margin:8px 0 12px}
.res-band{font-size:15px;color:var(--fg-2);display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;margin-bottom:8px}
.conf{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
  padding:5px 13px;border-radius:var(--radius-pill);border:1px solid var(--border-soft);color:var(--fg-2)}
.verify{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;color:var(--ok);
  background:rgba(90,122,60,.07);border:1px solid rgba(90,122,60,.24);
  border-radius:var(--radius-sm);padding:12px 15px;margin-top:18px;line-height:1.45}
.verify.part{color:var(--fg-2);background:var(--bg-sunken);border-color:var(--border-hair)}
.verify .tick{flex:none;line-height:1.4;font-size:14px}
.res-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.rc{background:var(--bg-sunken);border:1px solid var(--border-hair);
  border-radius:var(--radius-md);padding:16px 18px}
.rc .k{font-size:13px;color:var(--fg-3);margin-bottom:4px}
.rc .v{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.2}
.res-read{background:var(--mud-50);border:1px solid var(--border-mud);
  border-radius:var(--radius-md);padding:22px 24px;margin:22px 0}
.res-read h4{font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:10px}
.res-read p{font-size:15.5px;color:var(--fg-2)} .res-read p+p{margin-top:10px}

.locked{position:relative;border:1px solid var(--border-hair);border-radius:var(--radius-md);
  overflow:hidden;margin:22px 0;background:var(--bg-sunken)}
.locked-in{padding:22px 24px;filter:blur(7px);opacity:.4;user-select:none;pointer-events:none}
.locked-in h4{font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:8px}
.locked-in p{font-size:15px;color:var(--fg-2)}
.locked-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:8px;padding:24px;background:rgba(237,229,218,.93)}
.locked-over .lk{font-family:var(--font-display);font-weight:700;font-size:19px}
.locked-over p{font-size:15px;color:var(--fg-2);max-width:40ch}

.cta-final{background:var(--bg-sunken);border:1px solid var(--border-mud);
  border-radius:var(--radius-lg);padding:40px 32px;text-align:center;margin-top:28px}
.cta-final h3{font-family:var(--font-display);font-weight:700;
  font-size:clamp(24px,3.4vw,32px);line-height:1.2;margin-bottom:12px}
.cta-final p{color:var(--fg-2);font-size:16px;max-width:48ch;margin:0 auto 26px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stores{display:flex;gap:10px;justify-content:center;align-items:center;
  margin-top:18px;font-size:14.5px}
.stores a{color:var(--fg-brand);text-decoration:underline;text-underline-offset:3px}
.stores a:hover{color:var(--mud-700)}
.stores .sep{color:var(--oat-400)}
.store-hint{font-size:13px;color:var(--fg-3);margin-top:8px}
.share{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.share button{background:transparent;border:1px solid var(--border-soft);color:var(--fg-2);
  border-radius:var(--radius-pill);padding:9px 18px;font-family:var(--font-body);
  font-size:14px;cursor:pointer;transition:background var(--dur) var(--ease)}
.share button:hover{background:rgba(22,26,36,.04);color:var(--fg-1)}
.share button:focus-visible{outline:none;box-shadow:var(--shadow-focus)}

/* method */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.mcard{background:var(--bg-surface);border:1px solid var(--border-hair);
  border-radius:var(--radius-md);box-shadow:var(--shadow-xs);padding:26px}
.mcard .mq{display:flex;gap:12px;align-items:baseline;margin-bottom:10px}
.mcard .mn{font-family:var(--font-body);font-weight:700;font-size:15px;
  color:var(--fg-brand);flex:none}
.mcard h4{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.25}
.mcard p{font-size:15px;color:var(--fg-2)}
.mcard .why{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);
  font-size:14.5px;color:var(--fg-2)}
.mcard .why b{color:var(--fg-brand);font-weight:600}


/* Persistent app bar, pinned to the bottom once the hero scrolls away. */
.appbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg-surface);border-top:1px solid var(--border-soft);
  box-shadow:0 -4px 20px rgba(74,62,44,.10);
  transform:translateY(110%);transition:transform 260ms var(--ease);
  padding:12px 0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.appbar.show{transform:translateY(0)}
.appbar-in{max-width:1080px;margin:0 auto;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.appbar-txt{font-size:15px;color:var(--fg-1);font-weight:500;line-height:1.35}
.appbar-actions{display:flex;align-items:center;gap:8px;flex:none}
.appbar .btn{padding:11px 22px;font-size:15px;white-space:nowrap}
.appbar-close{background:none;border:0;cursor:pointer;color:var(--fg-3);
  font-size:20px;line-height:1;padding:8px 4px;font-family:var(--font-body)}
.appbar-close:hover{color:var(--fg-1)}
.appbar-close:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--radius-xs)}
body.appbar-on{padding-bottom:76px}
@media(max-width:900px){
  .appbar-in{padding:0 20px;gap:12px}
  .appbar-txt{font-size:14px}
  .appbar .btn{padding:11px 18px;font-size:14px}
  body.appbar-on{padding-bottom:84px}
}
@media(prefers-reduced-motion:reduce){.appbar{transition:none}}
footer{border-top:1px solid var(--rule);padding:48px 0 64px;font-size:14px;color:var(--fg-3)}
footer p{max-width:70ch} footer p+p{margin-top:14px}
footer a{color:var(--fg-brand)}

@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:40px;padding:24px 0 56px}
  .kundali-stage{order:-1} .kundali{max-width:280px}
  .quiz-shell{grid-template-columns:1fr;padding:26px;gap:24px}
  .quiz-side{position:static;display:flex;align-items:center;gap:18px}
  .mini-k{max-width:72px;flex:none} .mini-cap{font-size:13px;margin-top:6px}
  .quiz-side .side-txt{flex:1} .prog-wrap{margin-top:10px}
  .pgrid{grid-template-columns:1fr;gap:32px;padding:44px 0}
  .res-cards,.mgrid,.fields{grid-template-columns:1fr}
  section{padding:64px 0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var D2R=Math.PI/180,R2D=180/Math.PI;

function julianDay(y,m,d,hUT){if(m<=2){y-=1;m+=12;}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+hUT/24;}
function gmstDeg(jd){var T=(jd-2451545)/36525;
  return n360(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-(T*T*T)/38710000);}
function obliquity(jd){var T=(jd-2451545)/36525;
  return 23.439291-0.0130042*T-1.64e-7*T*T+5.04e-7*T*T*T;}

function tropAsc(lst,lat,eps){var th=lst*D2R,ph=lat*D2R,e=eps*D2R;
  return n360(Math.atan2(Math.cos(th),-(Math.sin(th)*Math.cos(e)+Math.tan(ph)*Math.sin(e)))*R2D);}

      -0.5*y0*y0*Math.sin(4*L0)-1.25*ecc*ecc*Math.sin(2*M));
  var phi=lat*D2R;
  var cH=(Math.cos(90.833*D2R)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
  if(cH>1)return{sunrise:6,sunset:18}; if(cH<-1)return{sunrise:0,sunset:24};
  var H=Math.acos(cH)*R2D, noon=12-lon/15-eq/60+tz;
  return {sunrise:noon-H/15,sunset:noon+H/15};}

/* Sastri / Uttara Kalamrita day-constellation check.
   V = vighatis from local mean sunrise to birth (1 vighati = 24s, 1h = 150).
   (4V) mod 9 must match the birth nakshatra counted from Ashwini/Magha/Mula.
   (3V) mod 7 must match the weekday counted from Sunday.
   The Vedic day starts at sunrise, so a pre-sunrise birth belongs to the
   previous sunrise-day for both counts. Of all the traditional methods,
   Sastri judges this the one "hitting the bull's eye". */
function mod1(x,m){var r=((x%m)+m)%m;return r===0?m:r;}
function sastriScore(h,srToday,srPrev,jsDow,nakNum){
  var V,dow;
  if(h>=srToday){V=Math.round((h-srToday)*150);dow=jsDow;}
  else{V=Math.round((h+24-srPrev)*150);dow=(jsDow+6)%7;}
  return (mod1(4*V,9)===mod1(nakNum,9)?1:0)+(mod1(3*V,7)===(dow+1)?1:0);
}
/* ---------- Uttara Kalamrita day-constellation sieve ----------
   Sastri, ch.3. V = vighatis (24s units) from local sunrise to birth.
     birth nakshatra group : (4V) mod 9, counted from Ashwini/Magha/Mula
     weekday               : (3V) mod 7, counted from Sunday
   Both must hold. Verified against the printed tables (p26).
   The Vedic day begins at sunrise, so a birth before sunrise belongs to
   the previous weekday.                                                    */
function mahadasha(ml,age){var nl=360/27,nk=Math.floor(ml/nl),fr=(ml%nl)/nl;
  var i=nk%9,rem=DYRS[DSEQ[i]]*(1-fr),t=0;
  for(var k=0;k<30;k++){if(age<t+rem)return DSEQ[i];t+=rem;i=(i+1)%9;rem=DYRS[DSEQ[i]];}
  return DSEQ[i];}

/* ---------------- RECTIFY ---------------- */
function rectify(inp){
  var A=inp.answers, se=sunEvents(inp.year,inp.month,inp.day,inp.lat,inp.lon,inp.tz);
  var sr=se.sunrise, ss=se.sunset;
  var pd=new Date(Date.UTC(inp.year,inp.month-1,inp.day));
  pd.setUTCDate(pd.getUTCDate()-1);
  var sePrev=sunEvents(pd.getUTCFullYear(),pd.getUTCMonth()+1,pd.getUTCDate(),
                       inp.lat,inp.lon,inp.tz);
  var srPrev=sePrev.sunrise;
  var jsDow=new Date(Date.UTC(inp.year,inp.month-1,inp.day)).getUTCDay();
  var W={early_morning:[sr-1.5,sr+1.5],morning:[sr+1,12],afternoon:[12,16.5],
    evening:[16.5,ss+1],night:[ss+0.5,24],late_night:[0,Math.max(1,sr-0.5)],unknown:[0,24]};
  var w=W[A.window]||W.unknown, ws=w[0], we=w[1];
  var hardAll = (A.window==='unknown');
  // Family memory is fuzzy, so it acts as a scoring prior, not a hard cut-off.
  // A birth remembered as "morning" can genuinely sit 40 minutes either side.
  function windowBonus(h){
    if(hardAll)return 0;
    var inW=(h>=ws&&h<=we)||(h+24>=ws&&h+24<=we);
    if(inW)return 2.2;
    var g=0.75; // 45-minute grace band
    var near=(h>=ws-g&&h<=we+g)||(h+24>=ws-g&&h+24<=we+g);
    return near?1.0:0;
  }
  var s=0,e=24;
  var LS=new Array(12).fill(0);
  function add(v,m){if(!v)return;for(var k in v)LS[+k]+=v[k]*m;}
  add(BUILD_V[A.build],1); add(VIBE_V[A.vibe],1);
  if(A.mark&&A.mark!=='none'&&LIMB[A.mark]!==undefined){
    LS[LIMB[A.mark]]+=2; LS[(LIMB[A.mark]+6)%12]+=0.8;}
  var DP={csection_planned:[9,12]};
  var step=1/150,best=null,curve=[];
  for(var h=s;h<e;h+=step){
    var r=sidAsc(inp.year,inp.month,inp.day,h,inp.lat,inp.lon,inp.tz);
    var si=Math.floor(r.lagna/30), sc=LS[si];
    sc+=windowBonus(h);
    var dp=DP[A.delivery]; if(dp&&h>=dp[0]&&h<=dp[1])sc+=1.2;
    if(A.syllable&&A.syllable!=='unknown'&&SYL_GROUP[A.syllable]){
      var ml=moonLon(r.jd),nk=Math.floor(ml/(360/27)),pd=Math.floor((ml%(360/27))/(360/108));
      var sy=PADA_SYL[nk]||[], grp=SYL_GROUP[A.syllable];
      // The answer is a sound group, so match the pada's syllable against the
      // whole group rather than one spelling of it.
      if(grp.indexOf(sy[pd])>=0)sc+=2.5;
      else { for(var gi=0;gi<sy.length;gi++) if(grp.indexOf(sy[gi])>=0){ sc+=1; break; } }
    }
    if(A.event&&A.event!=='none'&&A.eventAge!=null){
      var lord=mahadasha(moonLon(r.jd),A.eventAge);
      if((EVENT_LORDS[A.event]||[]).indexOf(lord)>=0)sc+=1.5;}
    var mlS=moonLon(r.jd);
    var nakNum=Math.floor(mlS/(360/27))+1;
    var sast=sastriScore(h,sr,srPrev,jsDow,nakNum);
    sc+=sast*1.6;
    var isDay=h>=sr&&h<=ss;
    if(A.window!=='unknown'){
      var cd=['early_morning','morning','afternoon'].indexOf(A.window)>=0;
      if(cd===isDay)sc+=0.5;}
    curve.push({h:h,sc:sc,si:si});
    if(!best||sc>best.sc)best={h:h,sc:sc,si:si,idx:curve.length-1};}
  if(!best)return null;
  // The honest window is the full stretch during which the winning lagna was
  // rising inside our search window — not just the argmax minute.
  // Walk outward from the peak minute to find the contiguous run of the winning
  // lagna, wrapping across midnight if that lagna straddles it.
  var N=curve.length, pk=best.idx;
  var lo=pk,hi=pk,guard=0;
  while(curve[(lo-1+N)%N].si===best.si && ++guard<N) lo=(lo-1+N)%N;
  guard=0;
  while(curve[(hi+1)%N].si===best.si && ++guard<N) hi=(hi+1)%N;
  var bs=curve[lo].h, be=curve[hi].h;
  var wrapped=be<bs;
  var rawSpan=wrapped?(be+24-bs):(be-bs);
  // A lagna occupies roughly two hours. Anything much shorter means the run
  // detection degenerated, so fall back to a symmetric window around the peak.
  if(rawSpan<0.33){
    bs=best.h-1; be=best.h+1;
    if(bs<0)bs+=24; if(be>=24)be-=24;
    wrapped=be<bs;
  }
  // Point estimate: midpoint of the highest-scoring stretch inside that span.
  // Narrow to where the lagna span and the remembered window actually overlap.
  // That intersection is the useful answer; its midpoint is the point estimate.
  var rs=bs, re=wrapped?be+24:be;
  if(!hardAll){
    var g2=0.75, is=Math.max(rs,ws-g2), ie=Math.min(re,we+g2);
    if(ie-is>=0.33){ rs=is; re=ie; }
  }
  var ctr=(rs+re)/2;
  // The lagna fixes the coarse window; Sastri's day-constellation arithmetic
  // picks the actual minute inside it. Snap to the best compliant minute.
  var bestSnap=null;
  for(var q=rs;q<=re;q+=1/60){
    var qh=q>=24?q-24:q;
    var qj=sidAsc(inp.year,inp.month,inp.day,qh,inp.lat,inp.lon,inp.tz).jd;
    var qs=sastriScore(qh,sr,srPrev,jsDow,Math.floor(moonLon(qj)/(360/27))+1);
    if(qs===0)continue;
    var near=Math.abs(q-(rs+re)/2);
    if(!bestSnap||qs>bestSnap.s||(qs===bestSnap.s&&near<bestSnap.near))
      bestSnap={h:qh,s:qs,near:near};
  }
  if(bestSnap)ctr=bestSnap.h;
  if(ctr>=24)ctr-=24;
  bs=rs>=24?rs-24:rs; be=re>=24?re-24:re;
  var by={}; curve.forEach(function(c){by[c.si]=Math.max(by[c.si]||0,c.sc);});
  var srt=Object.keys(by).map(function(k){return[+k,by[k]];}).sort(function(a,b){return b[1]-a[1];});
  var gap=srt.length>1?srt[0][1]-srt[1][1]:srt[0][1];
  var span=re-rs;
  var info=[A.window!=='unknown',A.build!=='unknown',A.vibe!=='unknown',A.mark!=='none',
    A.delivery!=='unknown',A.event!=='none',A.syllable!=='unknown'].filter(Boolean).length;
  var conf='Theek-thaak';
  if(gap>=2.5&&span>=0.5&&span<=2.4&&info>=5)conf='Kaafi pakka';
  else if(gap<0.9||span>3||span<0.4||info<=3)conf='Mota-moti';
  var cj=sidAsc(inp.year,inp.month,inp.day,ctr,inp.lat,inp.lon,inp.tz).jd;
  var mlc=moonLon(cj);
  var sastFinal=sastriScore(ctr,sr,srPrev,jsDow,Math.floor(mlc/(360/27))+1);
  return {sastri:sastFinal,time:ctr,bs:bs,be:be,li:best.si,lagna:SIGNS[best.si],
    runner:srt[1]?SIGNS[srt[1][0]]:null,conf:conf,
    nak:NAKS[Math.floor(mlc/(360/27))],moon:SIGNS[Math.floor(mlc/30)],
    sunrise:sr,sunset:ss,traits:TRAITS[best.si]};}

function fmt(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60);
  if(mm===60){mm=0;hh++;} hh=hh%24;
  var ap=hh<12?'AM':'PM',d=hh%12; if(d===0)d=12;
  return d+':'+String(mm).padStart(2,'0')+' '+ap;}

// North Indian chart: square + both diagonals + inner diamond.
function kundaliPaths(S){
  var m=S*0.06, a=m, b=S-m, c=(a+b)/2, q1=(a+c)/2, q3=(c+b)/2;
  return {
    frame:'M'+a+' '+a+'H'+b+'V'+b+'H'+a+'Z',
    diag:'M'+a+' '+a+'L'+b+' '+b+'M'+b+' '+a+'L'+a+' '+b,
    diamond:'M'+c+' '+a+'L'+b+' '+c+'L'+c+' '+b+'L'+a+' '+c+'Z',
    cx:c,cy:c,a:a,b:b,q1:q1,q3:q3
  };
}
// True North Indian house polygons, counter-clockwise from the top-centre diamond.
function housePolys(S){
  var p=kundaliPaths(S),a=p.a,b=p.b,c=p.cx,q1=p.q1,q3=p.q3;
  var T=[c,a],R=[b,c],B=[c,b],L=[a,c],C=[c,c];
  var tl=[q1,q1],tr=[q3,q1],br=[q3,q3],bl=[q1,q3];
  return [
    [tl,T,tr,C],        // 1  top diamond
    [[a,a],T,tl],       // 2
    [[a,a],tl,L],       // 3
    [L,tl,C,bl],        // 4  left diamond
    [[a,b],L,bl],       // 5
    [[a,b],bl,B],       // 6
    [B,bl,C,br],        // 7  bottom diamond
    [[b,b],B,br],       // 8
    [[b,b],br,R],       // 9
    [R,br,C,tr],        // 10 right diamond
    [[b,a],R,tr],       // 11
    [[b,a],tr,T]        // 12
  ];
}
function centroid(poly){
  var x=0,y=0; poly.forEach(function(pt){x+=pt[0];y+=pt[1];});
  return [x/poly.length,y/poly.length];
}
function drawKundali(svg,S,opts){
  opts=opts||{};
  var p=kundaliPaths(S), polys=housePolys(S), out='';
  for(var i=0;i<12;i++){
    var d='M'+polys[i].map(function(pt){return pt[0]+' '+pt[1];}).join('L')+'Z';
    out+='<path class="k-house" id="'+(opts.idp||'h')+i+'" d="'+d+'"/>';
  }
  out+='<path class="k-frame" d="'+p.frame+'"/>';
  out+='<path class="k-line" d="'+p.diag+'"/>';
  out+='<path class="k-line" d="'+p.diamond+'"/>';
  if(opts.nums){
    for(var j=0;j<12;j++){
      var ct=centroid(polys[j]);
      out+='<text class="k-num" x="'+ct[0]+'" y="'+(ct[1]+4)+'" text-anchor="middle">'+(j+1)+'</text>';
    }
  }
  if(opts.core!==undefined){
    out+='<text class="k-core" id="'+(opts.idp||'h')+'core" x="'+p.cx+'" y="'+(p.cy+S*0.02)+'" font-size="'+(S*0.075)+'">'+opts.core+'</text>';
  }
  svg.innerHTML=out;
  return {p:p,polys:polys};
}

  for(var st in CITY_DATA){
    var rows=CITY_DATA[st].split(';'), arr=new Array(rows.length);
    for(var i=0;i<rows.length;i++){
      var p=rows[i].split('|');
      arr[i]=[p[0], +p[1], +p[2]];
    }
    out[st]=arr;
  }
  return out;
})();
var STATE_NAMES=Object.keys(PLACES).sort();

var state={step:-1,setup:{},answers:{},result:null};
var main=$('quizMain');

function setProgress(){
  var n=S.questions.length;
  var pct = state.step<0 ? 3 : Math.min(100,((state.step+1)/(n+1))*100);
  if(state.result)pct=100;
  $('progFill').style.width=pct+'%';
  $('progLabel').textContent = state.step<0 ? S.progStart
    : state.result ? S.progDone : S.qOf(state.step+1);
  var lit = state.step<0 ? 0 : Math.round(((state.step+1)/(n+1))*12);
  for(var i=0;i<12;i++){
    var el=$('M'+i); if(!el)continue;
    el.classList.remove('locked');
    el.classList.toggle('lit', state.step>=0 && i<lit);
  }
  var cap=$('miniCap');
  if(state.result){
    for(var j=0;j<12;j++){var e2=$('M'+j);
      if(e2){e2.classList.remove('lit');e2.classList.toggle('locked',j===0);}}
    cap.textContent=sName(state.result.lagna);
  } else cap.textContent='';
}

function optHTML(v,label,note,sel){
  return '<button class="opt'+(sel?' sel':'')+'" data-v="'+esc(v)+'">'+
    '<span class="mark"></span><span class="lab">'+esc(label)+
    (note?'<small>'+esc(note)+'</small>':'')+'</span></button>';
}

function renderSetup(){
  var y=new Date().getFullYear(), days='',months='',years='',statesOpt='';
  for(var d=1;d<=31;d++)days+='<option>'+d+'</option>';
  for(var m=0;m<12;m++)months+='<option value="'+(m+1)+'">'+esc(S.months[m])+'</option>';
  for(var yy=y;yy>=1940;yy--)years+='<option>'+yy+'</option>';
  statesOpt='<option value="">'+esc(S.choose)+'</option>';
  STATE_NAMES.forEach(function(s){ statesOpt+='<option>'+esc(s)+'</option>'; });

  main.innerHTML=
    '<div class="step-n">'+esc(S.setupEyebrow)+'</div>'+
    '<div class="q-text">'+esc(S.setupH)+'</div>'+
    '<p class="q-help">'+esc(S.setupHelp)+'</p>'+
    '<div class="fields">'+
      '<div class="field"><label for="fd">'+esc(S.fDay)+'</label><select id="fd">'+days+'</select></div>'+
      '<div class="field"><label for="fm">'+esc(S.fMonth)+'</label><select id="fm">'+months+'</select></div>'+
    '</div>'+
    '<div class="fields">'+
      '<div class="field"><label for="fy">'+esc(S.fYear)+'</label><select id="fy">'+years+'</select></div>'+
      '<div class="field"><label for="fs">'+esc(S.fState)+'</label><select id="fs">'+statesOpt+'</select></div>'+
    '</div>'+
    '<div class="fields">'+
      '<div class="field"><label for="fc">'+esc(S.fCity)+'</label>'+
        '<select id="fc" disabled><option value="">'+esc(S.cityPick)+'</option></select></div>'+
      '<div class="field"></div>'+
    '</div>'+
    '<div class="err" id="err"></div>'+
    '<div class="q-nav"><button class="btn" id="goBtn">'+esc(S.setupBtn)+'</button></div>';

  $('fy').value='2000';

  $('fs').onchange=function(){
    var rows=PLACES[this.value]||[], fc=$('fc');
    if(!rows.length){
      fc.innerHTML='<option value="">'+esc(S.cityPick)+'</option>';
      fc.disabled=true; return;
    }
    var o='<option value="">'+esc(S.choose)+'</option>';
    for(var i=0;i<rows.length;i++)
      o+='<option value="'+rows[i][1]+','+rows[i][2]+'">'+esc(rows[i][0])+'</option>';
    fc.innerHTML=o; fc.disabled=false;
  };

  $('goBtn').onclick=function(){
    var err=$('err');
    if(!$('fs').value){ err.textContent=S.errState; return; }
    if(!$('fc').value){ err.textContent=S.errCity; return; }
    var d=+$('fd').value,m=+$('fm').value,yv=+$('fy').value;
    var dim=new Date(yv,m,0).getDate();
    if(d>dim){ err.textContent=S.errDays(S.months[m-1],yv,dim); return; }
    var cc=$('fc').value.split(',');
    state.setup={year:yv,month:m,day:d,lat:+cc[0],lon:+cc[1],tz:5.5};
    state.step=0; render();
  };
}

function renderQ(){
  var Q=S.questions[state.step];
  var o=Q.opts.map(function(op){
    return optHTML(op.v,op.l,op.s,state.answers[Q.key]===op.v); }).join('');
  main.innerHTML=
    '<div class="step-n">'+esc(S.qOf(state.step+1))+'</div>'+
    '<div class="q-text">'+esc(Q.q)+'</div>'+
    '<p class="q-help">'+esc(Q.help)+'</p>'+
    '<div class="opts">'+o+'</div>'+
    ((S.nudges&&S.nudges[state.step])?'<p class="nudge">'+esc(S.nudges[state.step])+'</p>':'')+
    '<div class="q-nav">'+(state.step>0?'<button class="back" id="bk">'+esc(S.back)+'</button>':'')+'</div>';
  Array.prototype.forEach.call(main.querySelectorAll('.opt'),function(b){
    b.onclick=function(){
      state.answers[Q.key]=b.getAttribute('data-v');
      if(Q.key==='event'&&b.getAttribute('data-v')!=='none'){ renderEventAge(); return; }
      state.step++; render();
    };
  });
  if($('bk'))$('bk').onclick=function(){ state.step--; render(); };
}

function renderEventAge(){
  // Name the change they just picked, so this screen reads on its own
  // rather than relying on them remembering the previous one.
  var eq=null, picked='';
  for(var i=0;i<S.questions.length;i++) if(S.questions[i].key==='event') eq=S.questions[i];
  if(eq) for(var j=0;j<eq.opts.length;j++)
    if(eq.opts[j].v===state.answers.event) picked=eq.opts[j].l;
  var o=S.ageOpts.map(function(b){
    return '<button class="opt" data-a="'+b[1]+'"><span class="mark"></span>'+
           '<span class="lab">'+esc(b[0])+'</span></button>'; }).join('');
  main.innerHTML=
    '<div class="step-n">'+esc(S.ageEyebrow(state.step+1))+'</div>'+
    '<div class="q-text">'+esc(S.ageQ)+'</div>'+
    (picked?'<p class="q-picked">'+esc(S.agePicked(picked))+'</p>':'')+
    '<p class="q-help">'+esc(S.ageHelp)+'</p>'+
    '<div class="opts">'+o+'</div>'+
    '<div class="q-nav"><button class="back" id="bk">'+esc(S.back)+'</button></div>';
  Array.prototype.forEach.call(main.querySelectorAll('.opt'),function(b){
    b.onclick=function(){ state.answers.eventAge=+b.getAttribute('data-a'); state.step++; render(); };
  });
  $('bk').onclick=function(){ render(); };
}


/* Sign naming differs by language: Sanskrit leads in Hinglish, English leads in EN. */
function sName(sg){ return LANG==='en' ? sg.en : sg.sa; }
function sAlt(sg){  return LANG==='en' ? sg.sa : sg.en; }

var CONF={ 'Kaafi pakka':'confHigh', 'Theek-thaak':'confMid', 'Mota-moti':'confLow' };

function renderResult(){
  var r=rectify({year:state.setup.year,month:state.setup.month,day:state.setup.day,
    lat:state.setup.lat,lon:state.setup.lon,tz:state.setup.tz,answers:state.answers});
  state.result=r;
  var lg=r.lagna;
  var verify = r.sastri===2
    ? '<div class="verify"><span class="tick">&#10003;</span>'+esc(S.sastriFull)+'</div>'
    : r.sastri===1
    ? '<div class="verify part"><span class="tick">&#8226;</span>'+esc(S.sastriPart)+'</div>' : '';
  main.innerHTML=
    '<div class="step-n">'+esc(S.resEyebrow)+'</div>'+
    '<div class="q-text">'+esc(S.resH)+'</div>'+
    '<div class="res-time">'+fmt(r.time)+'</div>'+
    '<div class="res-band"><span>'+esc(S.resWindow(fmt(r.bs),fmt(r.be)))+'</span>'+
      '<span class="conf"><span class="dot"></span>'+esc(S[CONF[r.conf]]||r.conf)+'</span></div>'+
    verify+
    '<div class="res-cards">'+
      '<div class="rc"><div class="k">'+esc(S.cLagna)+'</div><div class="v">'+esc(sName(lg))+'</div></div>'+
      '<div class="rc"><div class="k">'+esc(S.cNak)+'</div><div class="v">'+esc(r.nak)+'</div></div>'+
      '<div class="rc"><div class="k">'+esc(S.cMoon)+'</div><div class="v">'+esc(sName(r.moon))+'</div></div>'+
    '</div>'+
    '<div class="res-read"><h4>'+esc(S.readH(sName(lg)))+'</h4>'+
      '<p>'+esc(S.readP(sName(lg),sAlt(lg),S.traits[r.li][0],S.traits[r.li][1]))+'</p>'+
      (r.runner?'<p>'+esc(S.readAlt(sName(r.runner)))+'</p>':'')+
    '</div>'+
    '<div class="locked">'+
      '<div class="locked-in"><h4>'+esc(S.lockH)+'</h4><p>'+esc(S.lockP)+'</p></div>'+
      '<div class="locked-over"><div class="lk">'+esc(S.lockOverH)+'</div>'+
        '<p>'+esc(S.lockOverP)+'</p></div>'+
    '</div>'+
    '<div class="cta-final">'+
      '<h3>'+esc(S.ctaH)+'</h3><p>'+esc(S.ctaP)+'</p>'+
      '<div class="cta-row">'+
        '<a class="btn" id="appBtn" href="'+storeURL()+'" target="_blank" rel="noopener">'+
          esc(S.ctaBtn)+'</a>'+
        '<button class="btn ghost" id="again">'+esc(S.ctaAgain)+'</button>'+
      '</div>'+
      '<div class="stores">'+
        '<a href="'+STORE.google+'" target="_blank" rel="noopener">'+esc(S.storeGoogle)+'</a>'+
        '<span class="sep">&bull;</span>'+
        '<a href="'+STORE.apple+'" target="_blank" rel="noopener">'+esc(S.storeApple)+'</a>'+
      '</div>'+
      '<p class="store-hint">'+esc(S.storeHint)+'</p>'+
      '<div class="share">'+
        '<button id="shWa">'+esc(S.shareWa)+'</button>'+
        '<button id="shCp">'+esc(S.shareCp)+'</button>'+
      '</div>'+
    '</div>';
  var txt=S.shareText(fmt(r.time),sName(lg))+location.href;
  $('shWa').onclick=function(){ window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'); };
  $('shCp').onclick=function(){
    var b=this;
    navigator.clipboard.writeText(txt).then(function(){
      b.textContent=S.shareDone; setTimeout(function(){ b.textContent=S.shareCp; },1800); });
  };
  $('again').onclick=function(){
    state={step:-1,setup:{},answers:{},result:null};
    render(); $('quiz').scrollIntoView({behavior:'smooth'});
  };
}

function render(){
  if(state.step<0)renderSetup();
  else if(state.step<S.questions.length)renderQ();
  else renderResult();
  setProgress();
}
/* Reveal the app bar once the hero is out of the way; dismissible. */
(function appBar(){
  var bar=$('appbar'), dismissed=false;
  $('appbarClose').addEventListener('click', function(){
    dismissed=true; bar.classList.remove('show');
    document.body.classList.remove('appbar-on');
  });
  function sync(){
    if(dismissed) return;
    var show = window.scrollY > 320;
    bar.classList.toggle('show', show);
    document.body.classList.toggle('appbar-on', show);
  }
  window.addEventListener('scroll', sync, {passive:true});
  window.addEventListener('resize', sync);
  sync();
})();
render();

})();</script>
